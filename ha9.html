<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập HTML Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 20px;
            color: #333;
        }
        .form-container {
            background: #ffffff;
            max-width: 600px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-top: 5px solid #2196F3;
        }
        h2 {
            color: #1976D2;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .radio-group label, .checkbox-group label {
            font-weight: normal;
            cursor: pointer;
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .btn-submit {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #45a049;
        }
        .btn-reset {
            background-color: #f44336;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-reset:hover {
            background-color: #da190b;
        }
        hr {
            margin: 40px 0;
            border: none;
            border-top: 1px dashed #ccc;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: FORM KHẢO SÁT SỞ THÍCH -->
    <div class="form-container">
        <h2>Phần 1: Form Khảo sát thông tin</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên" required>
            </div>

            <div class="form-group">
                <label for="p1_email">Email:</label>
                <input type="email" id="p1_email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby" value="music"> Nghe nhạc</label>
                    <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
                </div>
            </div>

            <div class="btn-group">
                <input type="submit" value="Gửi thông tin" class="btn-submit">
                <input type="reset" value="Nhập lại" class="btn-reset">
            </div>
        </form>
    </div>

    <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN -->
    <div class="form-container" style="border-top-color: #4CAF50;">
        <h2>Phần 2: Form Đăng ký học viên</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên học viên" required>
            </div>

            <div class="form-group">
                <label for="p2_email">Email:</label>
                <input type="email" id="p2_email" name="email" placeholder="email@domain.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại">
            </div>

            <div class="form-group">
                <label for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-group">
                <label>Giới tính:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Nam</label>
                    <label><input type="radio" name="gender" value="female"> Nữ</label>
                    <label><input type="radio" name="gender" value="other"> Khác</label>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ của bạn"></textarea>
            </div>

            <div class="form-group">
                <label for="course">Khóa học:</label>
                <select id="course" name="course">
                    <option value="html_css">HTML & CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <div class="form-group">
                <label>Hình thức học:</label>
                <div class="radio-group">
                    <label><input type="radio" name="study_type" value="online"> Online</label>
                    <label><input type="radio" name="study_type" value="offline"> Offline</label>
                </div>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hobby" value="code"> Lập trình</label>
                    <label><input type="checkbox" name="hobby" value="game"> Chơi game</label>
                    <label><input type="checkbox" name="hobby" value="book"> Đọc sách</label>
                </div>
            </div>

            <div class="form-group">
                <label for="note">Ghi chú:</label>
                <textarea id="note" name="note" rows="3" placeholder="Ghi chú thêm..."></textarea>
            </div>

            <div class="btn-group">
                <input type="submit" value="Đăng ký" class="btn-submit">
                <input type="reset" value="Nhập lại" class="btn-reset">
            </div>
        </form>
    </div>

</body>
</html>
